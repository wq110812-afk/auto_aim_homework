# ================================================================
# 自瞄作业参数文件（调参用）
# 修改参数后重新运行 ./build/standard 即可生效。
# 队列/线程、绘制颜色、装甲板尺寸、车心距、录像等为代码内固定值，不在本文件参数化。
# ================================================================

#####-----敌我颜色-----#####
enemy_color: "blue"  # 敌方装甲板颜色："red" / "blue"

#####-----输入源-----#####
source_type: "hikrobot"  # "hikrobot" 海康相机（真机）/ "video" 离线视频
video_path: "assets/demo/demo.avi"  # 离线视频路径（相对仓库根目录，source_type=video 时有效）

#####-----视频播放参数（离线视频）-----#####
video_playback_fps: 0   # 按原始帧率播放；0 = 使用视频自带帧率。
video_loop: false       # true = 视频播完后循环播放；false = 播完退出

#####-----海康相机参数（io模块）-----#####
# 沿用原工程 sp_vision_25 海康相机参数（configs/standard4.yaml）
camera_name: "hikrobot"   
exposure_ms: 6            # 曝光时间，单位 ms（越大画面越亮）
gain: 8                  # 增益（越大噪点越多）
vid_pid: "2bdf:0001"      # 海康相机的 USB 标识（vid:pid），用于枚举设备

#####-----检测器参数（传统方法）-----#####
threshold: 100             # 二值化阈值（灯条亮度阈值）。灯条过曝时调高（如250），画面偏暗时调低
max_angle_error: 45        # 灯条与竖直方向允许的最大夹角误差（度）
min_lightbar_ratio: 1.5    # 灯条长宽比下限
max_lightbar_ratio: 20     # 灯条长宽比上限
min_lightbar_length: 8     # 灯条最小长度（像素）
min_armor_ratio: 1         # 装甲板宽长比下限（两灯条距离 / 灯条长度）
max_armor_ratio: 5         # 装甲板宽长比上限
max_side_ratio: 1.5        # 两条灯条长度之比上限
max_rectangular_error: 25  # 装甲板矩形度误差上限（度）
min_confidence: 0.8        # 编号识别最小置信度
classify_model: "assets/tiny_resnet.onnx"  # 编号识别模型（保留classify，去除ovclassify）

#####-----解算器参数（PnP）-----#####
# 装甲板3D尺寸（宽133mm、高57mm）与车心距（210mm）为代码内固定值，不参数化
camera_matrix: [1851.7070167840545, 0, 721.12585328714192, 0, 1851.8175594364079, 571.69879709276688, 0, 0, 1]
distort_coeffs: [-0.093662536083526302, 0.18945726820633155, -0.00040424349861928674, -0.0040568403852123142, 0]
